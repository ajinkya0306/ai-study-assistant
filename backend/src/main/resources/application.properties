spring.application.name=ai-study-assistant

server.port=8080

# Ollama connection
spring.ai.ollama.base-url=http://localhost:11434

# Chat model 
spring.ai.ollama.chat.model=qwen3:4b-instruct

# Disable Qwen3 thinking mode
spring.ai.ollama.chat.think=false

# Response generation settings
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-predict=1024

# Keep model loaded between requests
spring.ai.ollama.chat.keep-alive=10m

# Embedding model
spring.ai.ollama.embedding.model=nomic-embed-text

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_study_assistant
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Replace this with a strong random secret of at least 32 bytes.
app.jwt.secret=MyAiStudyAssistantJwtSecretKey2026SecureRandomKey123456
app.jwt.expiration-ms=86400000